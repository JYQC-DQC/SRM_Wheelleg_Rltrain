# Authoritative P3 runtime overlay template; pass with --policy. Null means pending.
# Training-only press schedule is time-based for both stages; manual rollout never uses it.
# Beam top/bottom are relative to the lane surface. Lane clear width is not beam outer width.
name: p3_jump
obs_version: 4
hidden_dims:
- 128
- 64
- 32
activation: elu
observation_scales:
  command:
  - 1.0
  - 1.0
  - 1.0
  height: 5.0
  angular_velocity: 0.5
  gravity: 1.0
  joint_position: 1.0
  joint_velocity: 0.1
action_scales:
- 0.5
- 0.5
- 10.0
- 0.5
- 0.5
- 10.0
action_clip: null
kp:
- null
- null
- null
- null
- null
- null
kd:
- null
- null
- null
- null
- null
- null
torque_limit_nm:
- null
- null
- null
- null
- null
- null
policy_family: p3
training:
  seed: 42
  num_envs: 4096
  rollout_steps: 48
  max_iterations: 20000
  save_interval: 500
  episode_length_s: 20.0
  init_noise_std: 1.0
  reward_clip: 1.0
  ppo:
    value_loss_coef: 2.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  commands:
    height_duration_s: [2.0, 6.0]
    vx_range_m_s: [-2.7, 2.7]  # ordinary flat approach; tunnel has a separate positive approach range
    height_range_m: null
    linear_slew_m_s2: step
    angular_slew_rad_s2: step
  reward_parameters:
    vx_tol_max: 0.50
    vx_tol_knee: 0.625
    wz_tol_max: 0.50
    wz_tol_knee: 0.625
    vx_error_sigma: 2.5
    wz_error_sigma: 2.5
    height_gate_shape: 2.0
    height_sigma: 0.001
    fork_square_scale: 5.0
    contact_force_n: null
  rewards:
    track_lin_vel: 1.0
    lin_vel_error: -1.0
    ang_vel_error: -1.0
    track_height: 1.0
    orientation: -1.0
    vertical_velocity: -1.0
    no_fork_square: -1.0
    stand_still: -1.0
    angular_xy: -0.2
    undesired_contact: -2.0
    termination: -4.0
    jump_landing: null
    tunnel_crossing: null
  evaluation:
    observation_delay_steps: null
    action_delay_steps: null
    duration_s: null
    episodes_per_case: null
    seed: null
    height_m: null
stages:
  jump:
    jump_smooth_scale: null  # active jump only; ordinary driving uses flat coefficients
    height_range_m: null
    event_duration_s: null
    landing_stable_s: null
    landing_tilt_rad: null
    flight_tracking_scale: null
    press_time_range_s: null
    no_press_probability: null
    moving_probability: null
  tunnel:
    jump_smooth_scale: null
    height_range_m: null
    event_duration_s: null
    landing_stable_s: null
    landing_tilt_rad: null
    flight_tracking_scale: null
    tunnel:
      beam_offset_from_entrance_m: 1.35
      beam_length_m: 0.35
      beam_width_m: null
      beam_height_m: 0.27
      beam_bottom_m: 0.25
      lane_width_m: 0.8
      vx_range_m_s: null
      approach_distance_range_m: null
      initial_yaw_range_rad: null
      clearance_margin_m: null
      landing_margin_m: null
      ground_tolerance_m: null
      collision_bounds_m: null
    press_time_range_s: null
    no_press_probability: null
    moving_probability: null
guide_version: '2.1'
