[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-wheelleg"
version = "0.1.0"
description = "SRM wheel-leg PPO configuration and deployment interface"
requires-python = ">=3.11"
dependencies = ["numpy", "PyYAML"]

[project.optional-dependencies]
model = ["torch"]
dev = ["pytest", "ruff"]
train = ["rsl-rl-lib==3.1.2"]
export = ["onnx", "onnxruntime"]

[tool.setuptools.packages.find]
include = ["wheelleg*", "isaac*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["isaac: requires Isaac Sim 5.1 / Isaac Lab 2.3.2 and a calibrated USD"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
