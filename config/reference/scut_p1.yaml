name: scut_p1_latest_from_scratch
obs_version: 2
hidden_dims:
- 256
- 128
- 64
activation: elu
observation_scales:
  command:
  - 1.0
  - 1.0
  - 1.0
  height: 5.0
  angular_velocity: 0.5
  gravity: 1.0
  joint_position: 1.0
  joint_velocity: 0.1
action_scales:
- 0.5
- 0.5
- 10.0
- 0.5
- 0.5
- 10.0
action_clip: null
kp:
- 60
- 60
- 0
- 60
- 60
- 0
kd:
- 2
- 2
- 0.2
- 2
- 2
- 0.2
torque_limit_nm:
- 40
- 40
- 5
- 40
- 40
- 5
policy_family: p1
training:
  seed: 42
  num_envs: 4096
  rollout_steps: 48
  max_iterations: 20000
  save_interval: 200
  episode_length_s: 20.0
  init_noise_std: 1.0
  reward_clip: 2.5
  ppo:
    # SCUT agents/rsl_rl_ppo_cfg.py:219（V14 继承 V13 的 4.0，不是 25v3 基类的 2.0）。
    value_loss_coef: 4.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  commands:
    segment_duration_s:
    - 3.0
    - 15.0
    height_duration_s:
    - 2.0
    - 6.0
    # 指南 §6.1 / SCUT V14/env_cfg.py:988-993 的最终范围；课程从 initial_fraction 起逐步放大。
    vx_range_m_s:
    - -2.7
    - 2.7
    # 转向上限 5 rad/s（原为 SCUT 的 2π）：更高的转速归 P2。
    wz_range_rad_s:
    - -5.0
    - 5.0
    # 上限 0.35 按用户要求设定（SCUT V14/env_cfg.py:564 为 0.20-0.42）；对应腿长约 0.29 m，在 0.32 m 以内。
    height_range_m:
    - 0.2
    - 0.35
    linear_slew_m_s2: 2.0
    angular_slew_rad_s2: 10.0
    height_slew_m_s: 0.1
    segment_probabilities:
    - 0.1
    - 0.25
    - 0.15
    - 0.25
    - 0.1
    - 0.15
    dash_range_m_s:
    - -3.0
    - 3.0
    # “直行加转向”片段的转向上限：课程比例超过 0.6（5×0.6=3）后，这类片段的转向等比例缩到 ±3 rad/s 以内，
    # 纯转向仍到 ±5。满速 2.7 m/s 加 3 rad/s 时外侧轮约 56 rad/s。
    combined_wz_limit_rad_s: 3.0
  reward_parameters:
    linear_sigma: 0.5
    angular_sigma: 0.25
    height_sigma: 0.001
    height_wide_sigma: 0.025
    # SCUT V14/env_cfg.py:749-752 的 linear_band 高度门控：误差 5 cm 内速度/转速奖励全给，10 cm 外为 0。
    height_gate_full_error_m: 0.05
    height_gate_zero_error_m: 0.1
    roll_sigma: 0.01
    pitch_sigma: 0.02
    fork_deadzone_m: 0.05
    stand_deadzone: 0.1
    contact_force_n: 3.0
    spin_velocity_sigma: 0.25
    spin_heading_sigma: 0.025
    air_wheel_torque_sigma: 1.5
    fork_square_scale: 5.0
    leg_length_symmetry_scale: 10.0
  rewards:
    track_lin_vel: 1.0
    # 权重按“先站稳再走稳”配：站姿类正奖励满分 5（高度 1+2、横滚 1、俯仰 1），运动类满分 2 且乘高度门控。
    # 约束：腿折叠但不倒的状态净收益仍为正（估算约 +0.4/s），否则摔倒（-4）反而比活着划算。
    # lin_vel_error 项是 (0.25e)²，-8 即 0.5e²：站起来后原地不动在 40% 课程下每秒约扣 0.13，另失去约 0.29 的跟踪分。
    lin_vel_error: -8.0
    track_ang_vel: 1.0
    ang_vel_error: -1.0
    track_height: 1.0
    # 宽核是起立阶段唯一有梯度的正奖励，权重取 2。
    track_height_wide: 2.0
    # 上一轮把这项加到每秒扣 2.5 也没有让机身抬高，反而把回合总回报压到约 -2.7（接近摔倒的 -4）。
    # 恢复 SCUT 的 -1.0：腿折叠、指令 0.20-0.35 m 时平均每秒约扣 1.0。
    height_error: -1.0
    flat_roll: 1.0
    flat_pitch: 1.0
    roll_penalty: -2.0
    pitch_penalty: -2.0
    vertical_velocity: -0.5
    angular_xy: -0.05
    no_fork: -1.0
    no_fork_square: -1.0
    # SCUT 平地为 -2、粗糙地形为 -5。上一轮约 40% 的时间有非轮触地却从不连续 0.4 s，只罚 -0.8/s；加到 -4。
    undesired_contact: -4.0
    stand_still: -1.0
    joint_torque: -0.0001
    wheel_power: -0.0001
    action_rate: -0.01
    # SCUT V14/env_cfg.py:869-883 的权重。动作二阶差分按策略步计算，100 Hz 下对同样平滑的轨迹比 50 Hz 弱，
    # 若训练后仍抖动再加大；关节/轮加速度项未移植。
    leg_joint_vel: -0.005
    wheel_vel: -0.00001
    action_smoothness_leg: -0.05
    action_smoothness_wheel: -0.01
    termination: -4.0
    leg_symmetry: 0.0
  evaluation:
    observation_delay_steps: 0
    action_delay_steps: 0
    duration_s: 10.0
    settling_s: 1.0
    episodes_per_case: 16
    seed: 123
    height_m: 0.22
    vx_values_m_s:
    - -2.0
    - -1.0
    - -0.5
    - 0
    - 0.5
    - 1.0
    - 2.0
    wz_values_rad_s:
    - -4.0
    - -2.0
    - -1.0
    - 1.0
    - 2.0
    - 4.0
    combined_commands:
    - - 1.0
      - 0
      - 1.0
    - - -1.0
      - 0
      - -1.0
  disturbance:
    baseline_evaluation_passed: false
    ramp_iterations: 3000
    final_push_velocity_m_s: 1.25
    collision_interval_s:
    - 8.0
    - 15.0
    collision_duration_s: 0.1
    collision_force_range_n:
    - 100.0
    - 300.0
    lateral_probability: 0.8
    phase2_start_iteration: null
  air_rewards:
    joint_limit: -10.0
    wheel_center: 10.0
    wheel_center_sigma: 0.02
    wheel_torque: 20.0
    wheel_torque_sigma: 1.5
    wheel_speed_alignment: -10.0
  command_curriculum:
    min_completed_episodes: 4096
    initial_fraction: 0.4
    increment: 0.05
    success_fraction: 0.8
    # 允许的回合平均误差 = 底限 + relative_error × 平均指令幅值；另要求平均高度误差达标。
    velocity_error_threshold_m_s: 0.1
    yaw_error_threshold_rad_s: 0.1
    relative_error: 0.25
    height_error_threshold_m: 0.05
  # 宽核高度奖励只在 p1-flat 退火：从 rewards.track_height_wide 线性退到 final_weight。
  # start_iteration 是绝对训练轮数；用 --resume 续训时要不小于续训起点，否则权重在续训第一步就跳变。
  height_wide_anneal:
    final_weight: 0.5
    start_iteration: 2000
    ramp_iterations: 500
  transition_reset:
    probability: 0.0
    states_npz: null
stages:
  flat:
    air_reset_probability: 0.0
    recovery_probability: 0.0
    disturbance_phase: 1
    reward_overrides: {}
  landing:
    air_reset_probability: 0.3
    air_height_offset_m: &id001
    - 0.12
    - 0.42
    air_vx_range_m_s: &id002
    - -2.5
    - 2.5
    # SCUT V14/env_cfg.py:1488-1521 (predefined_reset_air air_1)：空中出生同时随机倾角、横向速度、角速度和腿姿。
    air_tilt_rad: [0.1, 0.2]  # roll、pitch 的上限
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]  # roll、pitch、yaw 的上限
    air_leg_length_range_m: [0.15, 0.35]
    air_leg_angle_range_rad: [-0.7853981633974483, 0.7853981633974483]
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.0
    disturbance_phase: 1
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, wheel_vel: -2.0e-06}
  stairs:
    air_reset_probability: 0.3
    air_height_offset_m: *id001
    air_vx_range_m_s: *id002
    # SCUT V14/env_cfg.py:1488-1521 (predefined_reset_air air_1)：空中出生同时随机倾角、横向速度、角速度和腿姿。
    air_tilt_rad: [0.1, 0.2]  # roll、pitch 的上限
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]  # roll、pitch、yaw 的上限
    air_leg_length_range_m: [0.15, 0.35]
    air_leg_angle_range_rad: [-0.7853981633974483, 0.7853981633974483]
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.0
    terrain:
      tile_size_m: &id003
      - 8.0
      - 8.0
      rows: 8
      columns: 10
      flat_proportion: 0.3
      # RMUC 2027 规则手册 V1.0.0 图 4-27（中央高地 A-A 剖面）：外侧平台高 200 mm、宽 800 mm，路面 300 mm，
      # 边缘挡块 400 mm。上限取 200 mm × 1.2（指南 §6.3），下限 2 cm；踏面宽取平台宽度。
      step_height_range_m: [0.02, 0.24]
      step_width_m: 0.8
      slope_proportion: 0.1
      bump_proportion: 0.1
      slope_angle_range_rad:
      - 0.0
      - 0.4363323129985824
      # 同一手册图 4-37（起伏路段凸起）：高 70 mm、间距 240 mm。场地凸起是三角形截面，这里用矩形条近似，
      # 宽度取间距的一半，是设计选择，比实际凸起更难越过。
      bump_height_range_m: [0.01, 0.07]
      bump_spacing_m: 0.24
      bump_width_m: 0.12
      # 改自 SCUT manager/mdp/isaaclab/terrains.py:109-115 (RANDOM_UNIFORM_FOR_RM)：随机起伏地面，噪声 0-3 cm。
      # SCUT 定义了波浪地形但各地形集都没有启用，这里也不加。
      rough_proportion: 0.1
      rough_noise_range_m: [0.0, 0.03]
      rough_noise_step_m: 0.005
      rough_downsampled_scale_m: 0.2
      heightfield_border_width_m: 1.0
      # Flat ring around the whole tile grid (IsaacLab border, top at ground level); nothing exists beyond it.
      border_width_m: 5.0
      # Leaving the grid shrunk by this margin ends the episode as a timeout (SCUT V14 default 0.5 m).
      boundary_margin_m: 0.5
    stair_detection_distance_m: 0.5
    stair_detection_height_m: 0.05
    stair_false_positive: 0.1
    stair_false_negative: 0.1
    progress_weight: 1.0
    stuck_weight: -1.0
    impact_weight: -0.001
    stuck_window_s: 1.0
    stuck_distance_m: 0.05
    disturbance_phase: 2
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, wheel_vel: -2.0e-06}
    step_height_boost_m: 0.16
    step_height_hold_s: 2.0
    step_height_trigger_distance_m: 0.14
  recovery:
    air_reset_probability: 0.3
    air_height_offset_m: *id001
    air_vx_range_m_s: *id002
    # SCUT V14/env_cfg.py:1488-1521 (predefined_reset_air air_1)：空中出生同时随机倾角、横向速度、角速度和腿姿。
    air_tilt_rad: [0.1, 0.2]  # roll、pitch 的上限
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]  # roll、pitch、yaw 的上限
    air_leg_length_range_m: [0.15, 0.35]
    air_leg_angle_range_rad: [-0.7853981633974483, 0.7853981633974483]
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.15
    # 倒地出生，改自 SCUT V14/cfg_utils.py:198-226 (predefined_reset_ground)：腿接近水平，机身水平地从
    # recovery_root_height_m 落下。leg_height 是轮心低于髋轴的距离（负值为轮心高于髋轴）；
    # forward 指轮心在髋轴前方，对应 SCUT 的 negative 模式（概率 0.2/0.5）。不再使用接管状态库。
    recovery_root_height_m: 0.25
    recovery_forward_probability: 0.4
    recovery_leg_length_m: [0.14, 0.36]
    recovery_leg_height_m: [-0.06, 0.12]
    recovery_forward_leg_height_m: [-0.06, 0.0]
    rise_duration_s: 1.5
    zero_torque_s: 0.2
    recovery_timeout_s: 5.0
    disturbance_phase: 2
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, wheel_vel: -2.0e-06}
    terrain:
      tile_size_m: *id003
      rows: 8
      columns: 10
      flat_proportion: 0.3
      # RMUC 2027 规则手册 V1.0.0 图 4-27（中央高地 A-A 剖面）：外侧平台高 200 mm、宽 800 mm，路面 300 mm，
      # 边缘挡块 400 mm。上限取 200 mm × 1.2（指南 §6.3），下限 2 cm；踏面宽取平台宽度。
      step_height_range_m: [0.02, 0.24]
      step_width_m: 0.8
      slope_proportion: 0.1
      bump_proportion: 0.1
      slope_angle_range_rad:
      - 0.0
      - 0.4363323129985824
      # 同一手册图 4-37（起伏路段凸起）：高 70 mm、间距 240 mm。场地凸起是三角形截面，这里用矩形条近似，
      # 宽度取间距的一半，是设计选择，比实际凸起更难越过。
      bump_height_range_m: [0.01, 0.07]
      bump_spacing_m: 0.24
      bump_width_m: 0.12
      # 改自 SCUT manager/mdp/isaaclab/terrains.py:109-115 (RANDOM_UNIFORM_FOR_RM)：随机起伏地面，噪声 0-3 cm。
      # SCUT 定义了波浪地形但各地形集都没有启用，这里也不加。
      rough_proportion: 0.1
      rough_noise_range_m: [0.0, 0.03]
      rough_noise_step_m: 0.005
      rough_downsampled_scale_m: 0.2
      heightfield_border_width_m: 1.0
      # Flat ring around the whole tile grid (IsaacLab border, top at ground level); nothing exists beyond it.
      border_width_m: 5.0
      # Leaving the grid shrunk by this margin ends the episode as a timeout (SCUT V14 default 0.5 m).
      boundary_margin_m: 0.5
    stair_detection_distance_m: 0.5
    stair_detection_height_m: 0.05
    stair_false_positive: 0.1
    stair_false_negative: 0.1
    progress_weight: 1.0
    stuck_weight: -1.0
    impact_weight: -0.001
    stuck_window_s: 1.0
    stuck_distance_m: 0.05
    step_height_boost_m: 0.16
    step_height_hold_s: 2.0
    step_height_trigger_distance_m: 0.14
mode_semantics:
- normal
- stair
- zero
- recover
- zero
- zero
- zero
guide_version: '2.2'
reference_notes: P1-flat baseline only. Ranges/classifier thresholds are simulation
  design choices. Other stages retain their readiness requirements.
