name: scut_p1_latest_from_scratch
obs_version: 2
hidden_dims:
- 256
- 128
- 64
activation: elu
observation_scales:
  command:
  - 1.0
  - 1.0
  - 1.0
  height: 5.0
  angular_velocity: 0.5
  gravity: 1.0
  joint_position: 1.0
  joint_velocity: 0.1
action_scales:
- 0.5
- 0.5
- 10.0
- 0.5
- 0.5
- 10.0
action_clip: null
kp:
- 60
- 60
- 0
- 60
- 60
- 0
kd:
- 2
- 2
- 0.2
- 2
- 2
- 0.2
torque_limit_nm:
- 40
- 40
- 5
- 40
- 40
- 5
# Guide section 7.2 history estimator, implemented but not trained or deployed. frames: 0 keeps the
# single-frame obs_version 2 actor. Enabling it (frames 5, obs_version 3) changes the actor input to 40 and the
# ONNX inputs to obs[1,35] + obs_history[1,frames*35]; see docs/TRAINING.md before turning it on.
history_estimator:
  frames: 0
  hidden_dims: [128, 64]
policy_family: p1
training:
  seed: 42
  num_envs: 4096
  rollout_steps: 48
  max_iterations: 20000
  save_interval: 200
  episode_length_s: 20.0
  init_noise_std: 1.0
  reward_clip: 2.5
  # Used only when history_estimator.frames > 0: separate Adam optimizer, velocity MSE + contact BCE.
  history_estimator:
    learning_rate: 0.001
    velocity_loss_coef: 1.0
    contact_loss_coef: 1.0
  ppo:
    # SCUT agents/rsl_rl_ppo_cfg.py:219（V14 继承 V13 的 4.0，不是 25v3 基类的 2.0）。
    value_loss_coef: 4.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  commands:
    segment_duration_s:
    - 3.0
    - 15.0
    height_duration_s:
    - 2.0
    - 6.0
    # 指南 §6.1 / SCUT V14/env_cfg.py:988-993 的最终范围；课程从 initial_fraction 起逐步放大。
    vx_range_m_s:
    - -2.7
    - 2.7
    # 转向上限 5 rad/s（原为 SCUT 的 2π）：更高的转速归 P2。
    wz_range_rad_s:
    - -5.0
    - 5.0
    # 上限 0.35 按用户要求设定（SCUT V14/env_cfg.py:564 为 0.20-0.42）；对应腿长约 0.29 m，在 0.32 m 以内。
    height_range_m:
    - 0.2
    - 0.35
    linear_slew_m_s2: 2.0
    angular_slew_rad_s2: 10.0
    height_slew_m_s: 0.1
    segment_probabilities:
    - 0.1
    - 0.25
    - 0.15
    - 0.25
    - 0.1
    - 0.15
    dash_range_m_s:
    - -3.0
    - 3.0
    # “直行加转向”片段的转向上限：课程比例超过 0.6（5×0.6=3）后，这类片段的转向等比例缩到 ±3 rad/s 以内，
    # 纯转向仍到 ±5。满速 2.7 m/s 加 3 rad/s 时外侧轮约 56 rad/s。
    combined_wz_limit_rad_s: 3.0
  reward_parameters:
    linear_sigma: 0.5
    angular_sigma: 0.25
    height_sigma: 0.001
    height_wide_sigma: 0.025
    # SCUT V14/env_cfg.py:749-752 的 linear_band 高度门控：误差 5 cm 内速度/转速奖励全给，10 cm 外为 0。
    height_gate_full_error_m: 0.05
    height_gate_zero_error_m: 0.1
    roll_sigma: 0.01
    pitch_sigma: 0.02
    # (amplitude*exp(-vx²/sigma)+offset)²：零速 16，2 m/s 保留 70.9%，3 m/s 保留 60.3%。
    pitch_velocity_amplitude: 1.0
    pitch_velocity_sigma: 4.0  # (m/s)^2；P1 各阶段共用，连续衰减，无硬下限裁剪。
    pitch_velocity_offset: 3.0
    fork_deadzone_m: 0.05
    stand_deadzone: 0.1
    contact_force_n: 3.0
    spin_velocity_sigma: 0.25
    spin_heading_sigma: 0.025
    air_wheel_torque_sigma: 1.5
    fork_square_scale: 5.0
    leg_length_symmetry_scale: 10.0
  rewards:
    track_lin_vel: 1.0
    # 权重按“先站稳再走稳”配：站姿类正奖励满分 5（高度 1+2、横滚 1、俯仰 1），运动类满分 2 且乘高度门控。
    # 约束：腿折叠但不倒的状态净收益仍为正（估算约 +0.4/s），否则摔倒（-4）反而比活着划算。
    # lin_vel_error 项是 (0.25e)²，-8 即 0.5e²：站起来后原地不动在 40% 课程下每秒约扣 0.13，另失去约 0.29 的跟踪分。
    lin_vel_error: -8.0
    track_ang_vel: 1.0
    ang_vel_error: -1.0
    track_height: 1.0
    # 宽核是起立阶段唯一有梯度的正奖励，权重取 2。
    track_height_wide: 2.0
    # 上一轮把这项加到每秒扣 2.5 也没有让机身抬高，反而把回合总回报压到约 -2.7（接近摔倒的 -4）。
    # 恢复 SCUT 的 -1.0：腿折叠、指令 0.20-0.35 m 时平均每秒约扣 1.0。
    height_error: -1.0
    flat_roll: 1.0
    flat_pitch: 1.0
    roll_penalty: -2.0
    # 以下四项抑制平地“上下起伏换速度”。估算按机身高度正弦起伏：
    # - vertical_velocity 改为 (世界系 vz − 高度指令变化率)²，-0.5→-4：2 cm/2 Hz 起伏每秒约扣 0.13，3 cm/3 Hz 约 0.64；
    #   跟高度指令（斜率 0.1 m/s）几乎不扣。旧的机体系 vz 前倾高速时把前向速度误罚进来，现在没有。
    # - angular_xy -0.05→-0.2（复旦 ang_vel_xy 值）：±0.1 rad/3 Hz 俯仰摆动每秒约扣 0.36，匀速行驶约为 0。
    # - pitch_penalty -2→-3：指数系数见 reward_parameters；0.2 rad、1.5 m/s 每秒约扣 1.51。
    #   不学复旦 orientation -100：那会压住加速前倾。roll 不加强：高速转向需要侧倾。
    # - leg_joint_acc 见下。stairs/recovery 的 reward_overrides 保留前三项的旧权重，共用新的俯仰速度系数。
    pitch_penalty: -3.0
    vertical_velocity: -4.0
    angular_xy: -0.2
    no_fork: -1.0
    no_fork_square: -1.0
    # SCUT 平地为 -2、粗糙地形为 -5。上一轮约 40% 的时间有非轮触地却从不连续 0.4 s，只罚 -0.8/s；加到 -4。
    undesired_contact: -4.0
    # SCUT pretrained/26_infantry/flat_and_rotation/2026-07-29_23-20-03/params/env.yaml:1706。
    # P1 -1→-2：0.05 m/s 溜车每秒多扣 0.05，死区和 landing 腾空/缓冲屏蔽不变。
    stand_still: -2.0
    joint_torque: -0.0001
    wheel_power: -0.0001
    action_rate: -0.01
    # SCUT V14/env_cfg.py:869-883 的权重。动作二阶差分按策略步计算，100 Hz 下对同样平滑的轨迹比 50 Hz 弱，
    # 若训练后仍抖动再加大；关节/轮加速度项未移植。
    leg_joint_vel: -0.005
    # 100 Hz 策略步差分、奖励乘 dt。-2e-5→-2e-6，减轻快速制动/缓冲的代价。
    # 相同平滑关节运动下约为 SCUT V14/env_cfg.py:871 的 -5e-7 的 4 倍，不是冲击时的精确换算。
    # P1 腾空与 landing 首次缓冲期屏蔽此项，期间仍逐步更新速度历史；其他平滑项不变。
    leg_joint_acc: -2.0e-06
    wheel_vel: -0.00001
    action_smoothness_leg: -0.05
    action_smoothness_wheel: -0.01
    termination: -4.0
    leg_symmetry: 0.0
  evaluation:
    # Detailed flat checkpoint selection. Thresholds are engineering acceptance targets, not measured limits.
    flat_suite:
      height_samples: 3
      speed_fractions: [0.25, 0.5, 1.0]
      combined_fractions: [0.5, 1.0]
      seeds: [123, 456]
      startup_s: 2.0
      hold_s: 20.0
      stand_window_s: 10.0
      transition_settling_s: 2.0
      stable_hold_s: 0.5
      recovery_deadline_s: 3.0
      push_after_s: 4.0
      push_velocity_m_s: 0.25
      delay_command_fraction: 0.5
      # Physics ticks (2 ms), covering training sensor/action delays; not measured SRM latency.
      delay_pairs_steps: [[3, 3], [8, 5]]
      trace_stride: 5
      # Tracking MAE uses command_curriculum: floor + relative_error * mean |command|, height bound.
      acceptance:
        stand_drift_m: 0.2
        tilt_p95_rad: 0.17453292519943295
        contact_fraction: 0.01
    # Mid-range of training randomization (obs 3-8, action 3-5 physics ticks); zero delay is never trained.
    observation_delay_steps: 5
    action_delay_steps: 4
    duration_s: 10.0
    settling_s: 1.0
    episodes_per_case: 16
    seed: 123
    height_m: 0.22
    vx_values_m_s:
    - -2.0
    - -1.0
    - -0.5
    - 0
    - 0.5
    - 1.0
    - 2.0
    wz_values_rad_s:
    - -4.0
    - -2.0
    - -1.0
    - 1.0
    - 2.0
    - 4.0
    combined_commands:
    - - 1.0
      - 0
      - 1.0
    - - -1.0
      - 0
      - -1.0
  disturbance:
    # User-authorized flag on 2026-11-14; no new evaluation report was produced.
    baseline_evaluation_passed: true
    ramp_iterations: 3000
    final_push_velocity_m_s: 1.25
    collision_interval_s:
    - 8.0
    - 15.0
    collision_duration_s: 0.1
    collision_force_range_n:
    - 100.0
    - 300.0
    lateral_probability: 0.8
    phase2_start_iteration: 4000
  air_rewards:
    joint_limit: -10.0
    wheel_center: 10.0
    wheel_center_sigma: 0.02
    wheel_torque: 20.0
    wheel_torque_sigma: 1.5
    wheel_speed_alignment: -10.0
  command_curriculum:
    min_completed_episodes: 4096
    initial_fraction: 0.4
    increment: 0.05
    success_fraction: 0.75
    # 允许的回合平均误差 = 底限 + relative_error × 平均指令幅值；另要求平均高度误差达标。
    velocity_error_threshold_m_s: 0.1
    yaw_error_threshold_rad_s: 0.1
    relative_error: 0.25
    height_error_threshold_m: 0.05
  # 宽核高度奖励只在 p1-flat 退火：从 rewards.track_height_wide 线性退到 final_weight。
  # start_iteration 是绝对训练轮数；用 --resume 续训时要不小于续训起点，否则权重在续训第一步就跳变。
  height_wide_anneal:
    final_weight: 0.5
    start_iteration: 2000
    ramp_iterations: 500
  transition_reset:
    probability: 0.0
    states_npz: null
stages:
  flat:
    air_reset_probability: 0.0
    recovery_probability: 0.0
    disturbance_phase: 1
    reward_overrides: {}
  landing:
    landing_reward:
      progress_budget: 0.75
      success_bonus: 1.5
      failure_cost: 1.0
      contact_force_n: 3.0
      support_force_n: 20.0
      contact_timeout_s: 2.0
      # 首次触地后的一次性缓冲期：双轮连续支撑 settle_support_s 或触地后 cushion_max_s 先到者结束，
      # 期间不罚速度/高度跟踪，姿态项照常。截止时间从首次触地算，弹跳不能延长。设计初值。
      settle_support_s: 0.1
      cushion_max_s: 0.5
      window_s: 3.0
      stable_s: 0.5
      tilt_rad: 0.17453292519943295
      angular_xy_rad_s: 0.5
      vertical_velocity_m_s: 0.2
      height_error_m: 0.05
      # 腾空项全部只罚不奖，完全达标时为 0，自身不奖励推迟触地；姿态正奖励在空中仍生效，需观察 first_contact_s。
      # 轮心居中改自 SCUT V14/env_cfg.py:1617-1623, 1657（航向系 x，sigma 0.02，权重 10），权重取 4 是设计值；
      # 轮速对准航向系真实前向地速（触地不打滑的目标）；Actor 只看到指令，多数出生中二者一致。
      # 2→8 后本轮温和回调至 6，降低预转轮速引导与姿态/缓冲动作的竞争。
      wheel_center_weight: 4.0
      wheel_center_sigma: 0.02
      wheel_speed_weight: 6.0
      wheel_speed_sigma: 1.0
      # 落地窗口内（出生到首次触地后 window_s）非轮触地惩罚的倍率：-4/s × 8 = -32/s。
      # SCUT 在 airborne 状态（含触地后 0.3 s）用 ×25，约 -50/s；这里用自己的落地窗口门控，不依赖 airborne 分类器。
      contact_multiplier: 8.0
      # 导轮分级：事件未结束时，每次新的导轮接触都取该导轮刚体接触前一个物理子步（2 ms）的下落速度（含机身俯仰）。
      # ≥ guide_hard_speed_m_s（几乎没缓冲就撞上）按落地失败；否则不算失败，每次扣 guide_speed_cost × 速度/阈值（< 失败代价）。
      # 另有上面 ×8 的持续触地罚分（按策略步，每步至少 0.32）：短暂蹭地可以恢复成功，压着导轮支撑 0.1 s 就约 -3.2，
      # 会超过失败代价；导轮仍在物理终止名单里，累计 0.4 s 会终止。下落 0.13-0.29 m 时触地速度约 1.6-2.4 m/s。
      # 阈值是设计初值，看 LandingReward/guide_impact_speed_m_s/mean 再调。
      guide_body_regex: .*_guide_link
      guide_hard_speed_m_s: 1.0
      guide_speed_cost: 0.5
      # 伸腿引导：腾空时每条腿各自计算低于目标的缺口再取平均（一条长腿不能补偿另一条），
      # 缺口/scale 封顶为 1，即最多 -3/s。只管触地前，首次任意刚体接触后关闭，不约束接触后的压缩过程。
      # 目标 0.28 m：空中出生腿长上限 0.35 m，留余量避开闭链奇异位置；SCUT 写过类似项但未启用。实验初值。
      leg_extension_weight: 3.0  # 4→3，最大惩罚与未饱和区斜率均降低 25%；不新增正奖励。
      leg_extension_target_m: 0.28
      leg_extension_scale_m: 0.1
    # Training-only first air-reset landing diagnostics, independent of rewards and the airborne state machine.
    # Engineering diagnostic thresholds; contact force peaks are not certified structural safety limits.
    landing_diagnostics:
      first_contact_force_n: 3.0
      support_force_n: 20.0
      first_contact_timeout_s: 2.0
      observation_window_s: 3.0
      stable_duration_s: 0.5
      touchdown_difference_s: 0.05
      tilt_rad: 0.17453292519943295
      angular_xy_rad_s: 0.5
      vertical_velocity_m_s: 0.2
      height_error_m: 0.05
    # SCUT V14 为 0.3；landing提高到0.4，地面出生仍占60%；stairs为0，recovery为0.3。
    air_reset_probability: 0.4
    air_height_offset_m: &id001
    - 0.12
    - 0.42
    air_vx_range_m_s: &id002
    - -2.5
    - 2.5
    # SCUT V14/env_cfg.py:1488-1521 (predefined_reset_air air_1)：空中出生同时随机倾角、横向速度、角速度和腿姿。
    air_tilt_rad: [0.1, 0.2]  # roll、pitch 的上限
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]  # roll、pitch、yaw 的上限
    air_leg_length_range_m: [0.15, 0.35]
    air_leg_angle_range_rad: [-0.7853981633974483, 0.7853981633974483]
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    # 只对 landing：多数空中出生的前向速度=指令+噪声（像开下台阶），其余仍在 air_vx_range_m_s 内独立采样。
    # Actor 没有机身速度观测，独立采样时触地前无法预知地速。设计初值。
    air_vx_command_probability: 0.8
    air_vx_command_noise_m_s: 0.3
    # 空中出生高度课程（只对p1-landing训练；landing评测/recovery仍用完整区间，stairs禁用空中出生）。
    # 出生高度偏移在 [air_height_offset_m[0], 当前上限] 均匀采样，上限按 levels_m 逐级放开，最后一级必须等于 air_height_offset_m[1]。
    # 只统计最新一档（上一级上限到当前上限）出生、已结算的事件（外生 timeout 不算），成功指奖励状态机的首次恢复；
    # 一个窗口满 min_events 个事件时，成功率 ≥ success_rate 则升一级。每档只加 4 cm（最后一档 6 cm），新一档和上一档难度差小。
    # 4096 环境下每轮约 40 次空中出生，最高一档占 20-100%，窗口约需 25-130 轮。checkpoint 按上限高度恢复，
    # 改分档后续训不会降高度；旧 checkpoint 按旧分档 [0.2, 0.28, 0.35, 0.42] 换算。设计初值。
    air_height_curriculum:
      levels_m: [0.2, 0.24, 0.28, 0.32, 0.36, 0.42]
      min_events: 1024
      success_rate: 0.8
    # 只对 p1-landing：指令课程的一个窗口（4096 个结束的回合）内，除速度通过率 ≥ success_fraction 外，
    # 同一窗口里结算的、出生在当前最高一档高度的落地事件（外生 timeout 不算）首次恢复率也要 ≥ success_rate。
    # 用最高一档而不是全部高度：否则低处容易的落地会让速度跑在高度课程前面。窗口内最高一档约 400-1600 个事件。
    command_curriculum_landing_gate:
      min_events: 256
      success_rate: 0.75
    recovery_probability: 0.0
    disturbance_phase: 1
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {track_height_wide: 1.5, action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, leg_joint_acc: -4.0e-07, wheel_vel: -2.0e-06}
  # SCUT cfg_utils.py:281-313 directional slow/fast stairs; geometry ranges are design settings.
  # 2026-11-14: SCUT分地形/独立抬高原则；课程与保护差异见docs/STAIRS_REVISION_20261114.md。
  stairs:
    air_reset_probability: 0.0
    air_height_offset_m:
    - 0.12
    - 0.42
    air_vx_range_m_s:
    - -2.5
    - 2.5
    air_tilt_rad:
    - 0.1
    - 0.2
    air_vy_range_m_s:
    - -0.5
    - 0.5
    air_angular_velocity_rad_s:
    - 0.05
    - 0.1
    - 0.5
    air_leg_length_range_m:
    - 0.15
    - 0.35
    air_leg_angle_range_rad:
    - -0.7853981633974483
    - 0.7853981633974483
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.0
    terrain:
      tile_size_m:
      - 8.0
      - 8.0
      rows: 8
      columns: 20
      step_height_range_m:
      - 0.02
