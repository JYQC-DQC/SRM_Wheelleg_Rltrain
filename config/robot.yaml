# 已确认参数来自用户；null 项必须由 CAD、标定或完整辨识填写。
name: srm_wheelleg_nogimbal
variant: chassis_only
control_hz: 500
policy_hz: 100
wheel_reduction_ratio: 15.76
spring_nominal_force_n: 450.0
spring_stroke_m: 0.075
joint_order: [left_front, left_rear, left_wheel, right_front, right_rear, right_wheel]
leg_indices: [0, 1, 3, 4]
wheel_indices: [2, 5]
q_default_rad: [null, null, null, null, null, null]
q_zero_offset_rad: [null, null, null, null, null, null]
motor_direction: [null, null, null, null, null, null]
# 按腿分 CAN，索引为逻辑通道，具体句柄和 ID 在固件仓库标定。
can_bus: [1, 1, 1, 2, 2, 2]
pending_measurements:
  cad_closed_chain_geometry: null
  chassis_mass_com_inertia: null
  wheel_radius_m: null
  leg_joint_limits_rad: null
  motor_ids_and_protocol_readback: null
  imu_mounting_rotation: null
  hip_torque_calibration_and_envelope: null
  wheel_torque_calibration_and_envelope: null
  motor_sweep_and_held_out_validation: null
  spring_left_f0_k_hysteresis_damping: null
  spring_right_f0_k_hysteresis_damping: null
  measured_sensor_and_action_delay: null
  power_controller_limits: null

# Asset names must be copied from the actual closed-chain USD, in logical order.
asset:
  usd_path: null
  active_joint_names: [null, null, null, null, null, null]
  spring_joint_names: [null, null]
  passive_joint_names: null
  wheel_body_names: [null, null]
  base_body_name: null
  # 轮子以外不该触地的刚体（机身、腿连杆、导轮）；只罚不终止。
  undesired_contact_body_names: null
  # 持续触地即终止回合的刚体（机身、导轮）。
  termination_contact_body_names: null
  initial_root_position_m: [0.0, 0.0, null]
  initial_joint_positions_rad: null
  # One filtered ContactSensor per USD body; exact asset names, no bounding spheres.
  collision_body_names: null

training:
  # SCUT wheelbipe_V14/cfg_utils.py:75-124; clip raw quantities BEFORE scaling.
  observation_clip:
    command: [-100.0, 100.0]
    height: [0.0, 1.0]
    angular_velocity: [-100.0, 100.0]
    gravity: [-100.0, 100.0]
    joint_position: [-100.0, 100.0]
    joint_velocity: [-200.0, 200.0]
    previous_action: [-100.0, 100.0]
    mode: [-100.0, 100.0]
    base_linear_velocity: [-100.0, 100.0]
    base_height: [-10.0, 10.0]
    torque: [-100.0, 100.0]
    wheel_linear_velocity: [-100.0, 100.0]
    kp: [-100.0, 100.0]
    kd: [-100.0, 100.0]
    delay_steps: [-100.0, 100.0]
    mass_ratio: [-10.0, 10.0]
    wheel_contact: [0.0, 1.0]
    material: [-100.0, 100.0]
    spring_force: [-1000.0, 1000.0]
    voltage_scale: [-100.0, 100.0]
    power_scale: [-100.0, 100.0]
    command_error: [-100.0, 100.0]
    height_scan: [-10.0, 10.0]
  # SCUT wheelbipe25_v3/env.py:4918-4947; physical-state termination, not observation clipping.
  numerical_safety:
    joint_velocity_abs_max: 500.0
    base_linear_velocity_abs_max: 100.0
    base_angular_velocity_abs_max: 200.0
  # SCUT wheelbipe_V14/cfg_utils.py:133.
  critic_torque_scale: 0.05
  spawn_clearance_m: 0.01
  spawn_clearance_max_m: 0.03
  # Standing root height at full spring extension; requires SRM CAD/calibration.
  spring_extension_height_m: null
  # No authorization to widen real SRM mechanical limits.
  stairs_passive_joint_limits_rad: {}
  # Numerical settings and guide starting ranges, not identified robot parameters.
  env_spacing_m: 8.0
  gravity_m_s2: 9.81
  ground_material:
    static_friction: 1.0
    dynamic_friction: 1.0
    friction_combine_mode: multiply
    # 地面恢复系数取 1.0 并按乘法合成：实际碰撞的恢复系数 = 机器人一侧随机化的值（randomization.restitution）。
    restitution: 1.0
    restitution_combine_mode: multiply
  solver_position_iterations: 12
  solver_velocity_iterations: 6
  wheel_radius_m: null
  joint_lower_rad: [null, null, null, null, null, null]
  joint_upper_rad: [null, null, null, null, null, null]
  joint_target_margin_rad: 0.05
  hip_pivot_positions_b_m: [null, null]
  joint_armature: [null, null, null, null, null, null]
  joint_viscous_friction: [null, null, null, null, null, null]
  joint_dynamic_friction: [null, null, null, null, null, null]
  joint_coulomb_friction: [null, null, null, null, null, null]
  no_load_speed_rad_s: [null, null, null, null, null, null]
  saturation_torque_nm: [null, null, null, null, null, null]
  wheel_speed_limit_rad_s: null
  passive_damping: null
  passive_effort_limit: null
  spring:
    # q is the prismatic coordinate; direction maps q into compression.
    reference_q_m: [null, null]
    direction: [null, null]
    f0_n: [null, null]
    stiffness_n_m: [null, null]
    damping_n_s_m: [null, null]
    hysteresis_n: [null, null]
    force_limit_n: [null, null]
  observation_noise:
    angular_velocity: 0.25
    gravity: 0.05
    joint_position: 0.025
    leg_velocity: 0.5
    wheel_velocity: 1.0
  randomization:
    joint_zero_bias_rad: [-0.01, 0.01]
    inertia_scale: [0.9, 1.1]
    imu_roll_pitch_bias_rad: [-0.017453292519943295, 0.017453292519943295]
    base_mass_scale: [0.9, 1.3]
    limb_mass_scale: [0.9, 1.1]
    com_offset_m: [0.04, 0.02, 0.02]
    static_friction: [0.5, 1.2]
    dynamic_friction: [0.4, 1.0]
    # 轮子的恢复系数（碰撞后弹起的程度，0 为不弹）。地面是所有环境共用的一块，不能逐环境随机，所以随机量放在
    # 机器人一侧。范围是设计选择：SCUT 用 0.02-0.2，但它的地面是 0、实际恒为 0；这里取 0-0.2，待实测校准。
    restitution: [0.0, 0.2]
    # 轮子以外刚体的摩擦随机化（机身、导轮等）：列表，每项含 body_names、static_friction、
    # dynamic_friction、restitution、buckets；刚体名来自本车 USD。
    body_materials: null
    hip_static_friction_add: [0.25, 1.0]
    hip_dynamic_friction_add: [0.25, 1.0]
    hip_viscous_friction_add: [0.05, 0.2]
    wheel_static_friction_add: [0.05, 0.25]
    gain_scale: [0.75, 1.25]
    hip_torque_scale: [0.8, 1.1]
    wheel_torque_scale: [0.9, 1.1]
    spring_bias_n: [-50.0, 50.0]
    wheel_power_scale: [0.7, 1.0]
    voltage_scale: [0.85, 1.0]
    episode_voltage_drop: [0.0, 0.1]
    observation_delay_steps: [3, 8]
    action_delay_steps: [3, 5]
    push_interval_s: [5.0, 10.0]
    push_velocity_m_s: 0.25
    external_force_n: 10.0
    external_torque_nm: 1.0
    # SCUT wheelbipe25_v3/env_cfg.py:161-170: interval event; external wrench
    # persists between samples (interval 5-10 s), rather than a one-step pulse.
    external_wrench_duration_s: 10.0
  termination:
    tilt_rad: 0.6981317007977318
    airborne_tilt_rad: null
    contact_force_n: 3.0
    # 倾倒/触地须连续满足这么久才终止（SCUT V14/env_cfg.py:589-590 的 20×0.02 s）。
    duration_s: 0.4
    # 条件中断后计数不清零，满计数要 release_s 才回落到 0。取 2.0 s 时，触地时间占比超过约 1/6 就会累计到终止；
    # 若取 0.4 s（对称回落），占比低于 50% 的间歇撑地仍然不会终止。
    release_s: 2.0
  # 仅 p1-flat 训练出生使用：随机腿长/摆角的闭链逆解。几何量来自本车 CAD，不照抄参考机器人。
  leg_reset:
    joint_names: null
    link_lengths_m: null
    angle_offsets_rad: null
    length_range_m: null
    angle_range_rad: null
    root_tilt_rad: 0.15
    min_root_height_m: null
    settle_s: 1.0
  airborne:
    contact_force_n: 20.0
    enter_duration_s: 0.02
    exit_duration_s: 0.3
    max_duration_s: 1.0
    wheel_clearance_m: null
    base_height_m: null
