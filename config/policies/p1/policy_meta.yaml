        - 0.08
        - 0.12
        height_range_m:
        - 0.025
        - 0.045
        spacing_range_m:
        - 0.65
        - 0.85
        half_span_m: 1.4
      profiles:
        flat:
          proportion: 0.3
          kind: flat
          step_count: 0
          speed_range_m_s: null
          command_mode: motion
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -5.0
          - 5.0
          height_range_m: null
          start_speed_range_m_s: null
        up_one:
          proportion: 0.1
          kind: up
          step_count: 1
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
          start_speed_range_m_s: null
        down_one:
          proportion: 0.1
          kind: down
          step_count: 1
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
          start_speed_range_m_s: null
        mixed_one:
          proportion: 0.05
          kind: mixed
          step_count: 1
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
          start_speed_range_m_s: null
        mixed_fast:
          proportion: 0.05
          kind: mixed
          step_count: 1
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
          start_speed_range_m_s: null
        up_two:
          proportion: 0.05
          kind: up
          step_count: 2
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
          start_speed_range_m_s: null
        down_two:
          proportion: 0.05
          kind: down
          step_count: 2
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
          start_speed_range_m_s: null
        mixed_two:
          proportion: 0.1
          kind: mixed
          step_count: 2
          speed_range_m_s: null
          command_mode: traverse
          heading_yaw_limit_rad_s: 1.0
          yaw_range_rad_s:
          - -0.1
          - 0.1
          height_range_m: null
