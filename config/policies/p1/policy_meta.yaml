          heading_yaw_limit_rad_s: 0.5
          yaw_range_rad_s:
          - -0.3
          - 0.3
          height_range_m: null
          start_speed_range_m_s: null
      rough_proportion: 0.05
    progress_weight: 1.0
    stuck_weight: -1.0
    stuck_window_s: 1.0
    stuck_distance_m: 0.05
    disturbance_phase: 2
    reward_overrides:
      action_rate: -0.002
      action_smoothness_leg: -0.01
      action_smoothness_wheel: -0.002
      leg_joint_vel: -0.001
      leg_joint_acc: -4.0e-07
      wheel_vel: -2.0e-06
      pitch_penalty: -2.0
      vertical_velocity: -0.5
