# Guide v2.1: action_clip: null means NO raw clipping; other nulls are unmeasured.
name: p1_locomotion
obs_version: 4
hidden_dims: [128, 64, 32]
activation: elu
observation_scales:
  command:
  - 1.0
  - 1.0
  - 1.0
  height: 5.0
  angular_velocity: 0.5
  gravity: 1.0
  joint_position: 1.0
  joint_velocity: 0.1
action_scales:
- 0.5
- 0.5
- 10.0
- 0.5
- 0.5
- 10.0
action_clip: null
kp:
- null
- null
- null
- null
- null
- null
kd:
- null
- null
- null
- null
- null
- null
torque_limit_nm:
- null
- null
- null
- null
- null
- null
policy_family: p1
training:
  seed: 42
  num_envs: 4096
  rollout_steps: 48
  max_iterations: 20000
  save_interval: 500
  episode_length_s: 20.0
  init_noise_std: 1.0
  ppo:
    value_loss_coef: 2.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  commands:
    segment_duration_s:
    - 3.0
    - 15.0
    height_duration_s:
    - 2.0
    - 6.0
    vx_range_m_s: [-2.7, 2.7]
    wz_range_rad_s: [-6.283185307179586, 6.283185307179586]  # +/-2*pi rad/s
    height_range_m: null
    linear_slew_m_s2: 2.0
    angular_slew_rad_s2: 10.0
    segment_probabilities:
    - 0.1
    - 0.25
    - 0.15
    - 0.25
    - 0.1
    - 0.15
    dash_speed_abs_m_s: [2.0, 3.0]  # uniform magnitude; equally likely forward or reverse
    combined_wz_limit_rad_s: 4.0
    heading_kp: 3.0
    heading_max_wz: 6.283185307179586  # +/-2*pi rad/s at full curriculum
  shu_rewards:
    # Shapes are implemented; unapproved tolerances require explicit tuning before training.
    vx_tol_max: 0.50
    vx_tol_knee: 0.625
    wz_tol_max: 0.50
    wz_tol_knee: 0.625
    vx_error_sigma: 2.5
    wz_error_sigma: 2.5
    height_wide_weight: 1.0
    height_gate_shape: 2.0
  evaluation:
    observation_delay_steps: null
    action_delay_steps: null
    duration_s: 10.0
    settling_s: 1.0
    episodes_per_case: 16
    seed: 123
    height_m: null
    vx_values_m_s: null
    wz_values_rad_s: null
    combined_commands: null
  disturbance:
    baseline_evaluation_passed: false
    ramp_iterations: 3000
    final_push_velocity_m_s: 1.25
    collision_interval_s:
    - 8.0
    - 15.0
    collision_duration_s: 0.1
    collision_force_range_n:
    - 100.0
    - 300.0
    lateral_probability: 0.8
    phase2_start_iteration: null
stages:
  flat:
    disturbance_phase: 1
    recovery_probability: 0.20  # flat only: remaining 80% ordinary ground births
    initial_fraction: 0.25
    min_segments: 512  # settled attempts at the current difficulty, independent per bucket
    error_floor: [0.10, 0.10, 0.05]  # vx (m/s), yaw (rad/s), height (m); grading, not reward dead zones
    relative_error: [0.25, 0.25, 0.0]
  landing:
    air_wheel_height_bias_m: null  # calibrate with SHU leg workspace and wheel radius
    air_wheel_height_max_m: null   # root to highest wheel bottom, measured vertically
    disturbance_phase: 1
    height_edges_m: [null, null, null, null, 0.45]  # provisional H4; confirm all five on the actual chassis
  stairs:
    air_reset_probability: 0.0
    recovery_probability: 0.0
    terrain:
      tile_size_m: [12.0, 12.0]  # continuous atlas; larger than the SCUT 9 m training tile
      border_width_m: 5.0
      rows: 10
      route:
        up_height_range_m: [null, null]    # measured non-wheel clearance above stair crest
        down_height_range_m: [null, null]  # independent lower walking posture; retain landing stroke
        vx_range_m_s: null  # Positive forward-speed range for traverse only.
        heading_kp: null
        heading_max_wz_rad_s: null
        corridor_width_m: null  # Full route width, centered on the tile.
        clearance_m: null  # Vehicle envelope/safety margin to corridor, obstacle and tile edges.
      # Absolute shares of all resets. Flat is fixed at 0.30; these must sum to 0.70.
      groups: {rough: 0.05, grid: 0.10, slope: 0.10, stairs: 0.45}
      locked_stair_weights: {single: 0.30, double: 0.70}
      stair_lip: {height_m: 0.05, width_m: 0.15}  # approximate depth along travel
      free_map:
        edge_margin_m: 0.5
        command_limits:
          slope: {vx_abs_max_m_s: 2.0, wz_abs_max_rad_s: 3.141592653589793}
      stair_weights:
        single_up: 0.20
        double_up: 0.60
        triple_up: 0.20
        single_down: 0.20
        double_down: 0.60
        triple_down: 0.20
      # Zero-based row, finalized route-attempt window, and required pass fraction per prerequisite.
      gates:
        single_up: {row: null, window: null, success_fraction: null}
        double_up: {row: null, window: null, success_fraction: null}
        single_down: {row: null, window: null, success_fraction: null}
        double_down: {row: null, window: null, success_fraction: null}
      profiles:
        flat:
          row_range: null
          command_mode: free
          geometry: {spawn_x_m: null, ground_thickness_m: null}
        rough:
          row_range: null
          command_mode: free
          geometry:
            spawn_x_m: null
            ground_thickness_m: null
            surface_x_range_m: null
            surface_resolution_m: null
            rough_amplitude_range_m: null
        grid:
          row_range: null
          command_mode: free
          geometry:
            spawn_x_m: null
            ground_thickness_m: null
            surface_x_range_m: null
            grid_y_range_m: null
            grid_bar_x_m: null
            grid_bar_y_m: null
            grid_width_m: null
            grid_height_range_m: null
        slope:
          row_range: [0, 9]
          command_mode: free
          geometry: {spawn_x_m: null, ground_thickness_m: null, slope_angle_range_rad: [0.0, 0.4363323129985824]}
        single_up:
          row_range: null  # Inclusive; set both ends to the same approved row to start there.
          command_mode: traverse
          exit_distance_m: null  # Along +X, measured from this tile spawn.
          geometry:
            spawn_x_m: null
            ground_thickness_m: null
            first_edge_x_m: null
            step_width_m: 0.30  # UC figure 4-17 tread run, not the lane width
            step_height_range_m: [0.10, 0.23]
        double_up:
          row_range: null  # Inclusive; set both ends to the same approved row to start there.
          command_mode: traverse
          exit_distance_m: null  # Along +X, measured from this tile spawn.
          geometry:
            spawn_x_m: null
            ground_thickness_m: null
            first_edge_x_m: null
            step_width_m: 0.30  # UC figure 4-17 tread run, not the lane width
            step_height_range_m: [0.10, 0.23]
        single_down:
          row_range: null  # Inclusive; set both ends to the same approved row to start there.
          command_mode: traverse
          exit_distance_m: null  # Along +X, measured from this tile spawn.
          geometry:
