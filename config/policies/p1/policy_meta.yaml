# Guide v2.1: action_clip: null means NO raw clipping; other nulls are unmeasured.
name: p1_locomotion
obs_version: 2
hidden_dims:
- 256
- 128
- 64
activation: elu
observation_scales:
  command:
  - 1.0
  - 1.0
  - 1.0
  height: 5.0
  angular_velocity: 0.5
  gravity: 1.0
  joint_position: 1.0
  joint_velocity: 0.1
action_scales:
- 0.5
- 0.5
- 10.0
- 0.5
- 0.5
- 10.0
action_clip: null
kp:
- null
- null
- null
- null
- null
- null
kd:
- null
- null
- null
- null
- null
- null
torque_limit_nm:
- null
- null
- null
- null
- null
- null
# Guide section 7.2 history estimator, implemented but not trained or deployed. frames: 0 keeps the
# single-frame obs_version 2 actor. Enabling it (frames 5, obs_version 3) changes the actor input to 40 and the
# ONNX inputs to obs[1,35] + obs_history[1,frames*35]; see docs/TRAINING.md before turning it on.
history_estimator:
  frames: 0
  hidden_dims: [128, 64]
policy_family: p1
training:
  seed: 42
  num_envs: 4096
  rollout_steps: 48
  max_iterations: 20000
  save_interval: 500
  episode_length_s: 20.0
  init_noise_std: 1.0
  reward_clip: 2.5
  # Used only when history_estimator.frames > 0: separate Adam optimizer, velocity MSE + contact BCE.
  history_estimator:
    learning_rate: 0.001
    velocity_loss_coef: 1.0
    contact_loss_coef: 1.0
  ppo:
    value_loss_coef: 2.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  commands:
    segment_duration_s:
    - 3.0
    - 15.0
    height_duration_s:
    - 2.0
    - 6.0
    vx_range_m_s: null
    wz_range_rad_s: null
    height_range_m: null
    linear_slew_m_s2: 2.0
    angular_slew_rad_s2: 10.0
    height_slew_m_s: null
    segment_probabilities:
    - 0.1
    - 0.25
    - 0.15
    - 0.25
    - 0.1
    - 0.15
    dash_range_m_s: null
    # “直行加转向”片段的转向上限 rad/s：课程放大后超过它时等比例缩到这个范围内；按本车轮速能力填写。
    combined_wz_limit_rad_s: null
  reward_parameters:
    linear_sigma: 0.5
    angular_sigma: 0.25
    height_sigma: 0.001
    height_wide_sigma: 0.025
    # SCUT V14/env_cfg.py:749-752 的 linear_band 高度门控：误差 5 cm 内速度/转速奖励全给，10 cm 外为 0。
    height_gate_full_error_m: 0.05
    height_gate_zero_error_m: 0.1
    roll_sigma: 0.01
    pitch_sigma: 0.02
    fork_deadzone_m: 0.05
    stand_deadzone: 0.1
    contact_force_n: 3.0
    spin_velocity_sigma: 0.25
    spin_heading_sigma: 0.025
    air_wheel_torque_sigma: 1.5
    fork_square_scale: 5.0
    leg_length_symmetry_scale: 10.0
  rewards:
    track_lin_vel: 1.0
    lin_vel_error: -1.0
    track_ang_vel: 1.0
    ang_vel_error: -1.0
    track_height: 1.0
    track_height_wide: 1.0
    height_error: -1.0
    flat_roll: 1.0
    flat_pitch: 1.0
    roll_penalty: -2.0
    pitch_penalty: -2.0
    vertical_velocity: -0.5
    angular_xy: -0.05
    no_fork: -1.0
    no_fork_square: -1.0
    undesired_contact: -2.0
    stand_still: -1.0
    joint_torque: -0.0001
    wheel_power: -0.0001
    action_rate: -0.01
    # SCUT V14/env_cfg.py:869-883 的权重。
    leg_joint_vel: -0.005
    wheel_vel: -0.00001
    action_smoothness_leg: -0.05
    action_smoothness_wheel: -0.01
    termination: -4.0
    leg_symmetry: 0.0
  evaluation:
    # Detailed flat checkpoint selection. Thresholds are engineering acceptance targets, not measured limits.
    flat_suite:
      height_samples: 3
      speed_fractions: [0.25, 0.5, 1.0]
      combined_fractions: [0.5, 1.0]
      seeds: [123, 456]
      startup_s: 2.0
      hold_s: 20.0
      stand_window_s: 10.0
      transition_settling_s: 2.0
      stable_hold_s: 0.5
      recovery_deadline_s: 3.0
      push_after_s: 4.0
      push_velocity_m_s: 0.25
      delay_command_fraction: 0.5
      # Physics ticks (2 ms), covering training sensor/action delays; not measured SRM latency.
      delay_pairs_steps: [[3, 3], [8, 5]]
      trace_stride: 5
      # Tracking MAE uses command_curriculum: floor + relative_error * mean |command|, height bound.
      acceptance:
        stand_drift_m: 0.2
        tilt_p95_rad: 0.17453292519943295
        contact_fraction: 0.01
    observation_delay_steps: null
    action_delay_steps: null
    duration_s: 10.0
    settling_s: 1.0
    episodes_per_case: 16
    seed: 123
    height_m: null
    vx_values_m_s: null
    wz_values_rad_s: null
    combined_commands: null
  disturbance:
    baseline_evaluation_passed: false
    ramp_iterations: 3000
    final_push_velocity_m_s: 1.25
    collision_interval_s:
    - 8.0
    - 15.0
    collision_duration_s: 0.1
    collision_force_range_n:
    - 100.0
    - 300.0
    lateral_probability: 0.8
    phase2_start_iteration: null
  air_rewards:
    joint_limit: -10.0
    wheel_center: 10.0
    wheel_center_sigma: null
    wheel_torque: 20.0
    wheel_torque_sigma: 1.5
    wheel_speed_alignment: -10.0
  command_curriculum:
    min_completed_episodes: 4096
    initial_fraction: 0.25
    increment: 0.05
    success_fraction: 0.8
    # 允许的回合平均误差 = 底限 + relative_error × 平均指令幅值；另要求平均高度误差达标。
    velocity_error_threshold_m_s: null
    yaw_error_threshold_rad_s: null
    relative_error: 0.25
    height_error_threshold_m: null
  # 宽核高度奖励只在 p1-flat 退火：从 rewards.track_height_wide 线性退到 final_weight。
  # start_iteration 是绝对训练轮数；用 --resume 续训时要不小于续训起点，否则权重在续训第一步就跳变。
  height_wide_anneal:
    final_weight: 0.5
    start_iteration: 2000
    ramp_iterations: 500
  transition_reset:
    probability: 0.0
    states_npz: null
stages:
  flat:
    air_reset_probability: 0.0
    recovery_probability: 0.0
    disturbance_phase: 1
    reward_overrides: {}
  landing:
    # Training-only first air-reset landing diagnostics, independent of rewards and the airborne state machine.
    # Engineering diagnostic thresholds; contact force peaks are not certified structural safety limits.
    landing_diagnostics:
      first_contact_force_n: 3.0
      support_force_n: 20.0
      first_contact_timeout_s: 2.0
      observation_window_s: 3.0
      stable_duration_s: 0.5
      touchdown_difference_s: 0.05
      tilt_rad: 0.17453292519943295
      angular_xy_rad_s: 0.5
      vertical_velocity_m_s: 0.2
      height_error_m: 0.05
    air_reset_probability: 0.3
    air_height_offset_m: &id001
    - 0.12
    - 0.42
    air_vx_range_m_s: &id002
    - -2.5
    - 2.5
    # 空中出生的倾角、横向速度、角速度上限照 SCUT V14/env_cfg.py:1488-1521；腿长和摆角范围按本车几何填写。
    air_tilt_rad: [0.1, 0.2]
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]
    air_leg_length_range_m: null
    air_leg_angle_range_rad: null
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.0
    disturbance_phase: 1
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {track_height_wide: 1.5, action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, wheel_vel: -2.0e-06}
  stairs:
    air_reset_probability: 0.3
    air_height_offset_m: *id001
    air_vx_range_m_s: *id002
    # 空中出生的倾角、横向速度、角速度上限照 SCUT V14/env_cfg.py:1488-1521；腿长和摆角范围按本车几何填写。
    air_tilt_rad: [0.1, 0.2]
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]
    air_leg_length_range_m: null
    air_leg_angle_range_rad: null
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.0
    terrain:
      tile_size_m: &id003
      - 8.0
      - 8.0
      rows: 8
      columns: 10
      flat_proportion: 0.3
      step_height_range_m: null
      step_width_m: null
      slope_proportion: 0.1
      bump_proportion: 0.1
      slope_angle_range_rad:
      - 0.0
      - 0.4363323129985824
      bump_height_range_m: null
      bump_spacing_m: null
      bump_width_m: null
      # 改自 SCUT manager/mdp/isaaclab/terrains.py:109-115 (RANDOM_UNIFORM_FOR_RM)：随机起伏地面，噪声 0-3 cm。
      # SCUT 定义了波浪地形但各地形集都没有启用，这里也不加。
      rough_proportion: 0.1
      rough_noise_range_m: [0.0, 0.03]
      rough_noise_step_m: 0.005
      rough_downsampled_scale_m: 0.2
      heightfield_border_width_m: 1.0
      # Flat ring around the whole tile grid (IsaacLab border, top at ground level); nothing exists beyond it.
      border_width_m: 5.0
      # Leaving the grid shrunk by this margin ends the episode as a timeout (SCUT V14 default 0.5 m).
      boundary_margin_m: 0.5
    stair_detection_distance_m: 0.5
    stair_detection_height_m: 0.05
    stair_false_positive: 0.1
    stair_false_negative: 0.1
    progress_weight: 1.0
    stuck_weight: -1.0
    impact_weight: -0.001
    stuck_window_s: 1.0
    stuck_distance_m: 0.05
    disturbance_phase: 2
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, wheel_vel: -2.0e-06}
    step_height_boost_m: 0.16
    step_height_hold_s: 2.0
    step_height_trigger_distance_m: 0.14
  recovery:
    air_reset_probability: 0.3
    air_height_offset_m: *id001
    air_vx_range_m_s: *id002
    # 空中出生的倾角、横向速度、角速度上限照 SCUT V14/env_cfg.py:1488-1521；腿长和摆角范围按本车几何填写。
    air_tilt_rad: [0.1, 0.2]
    air_vy_range_m_s: [-0.5, 0.5]
    air_angular_velocity_rad_s: [0.05, 0.1, 0.5]
    air_leg_length_range_m: null
    air_leg_angle_range_rad: null
    # SCUT V14/env_cfg.py:1510-1516：空中出生后 3 s 内限制指令，落地过程中不要求高速转向。
    # SCUT 还限制高度 0.18-0.43 m，包含了我们的高度指令范围，不起作用，没有实现。
    air_command_limit_s: 3.0
    air_command_vx_limit_m_s: 2.5
    air_command_wz_limit_rad_s: 1.5707963267948966
    recovery_probability: 0.15
    # 倒地出生（腿接近水平、机身水平落下），不再使用接管状态库；几何量按本车填写。
    recovery_root_height_m: null
    recovery_forward_probability: 0.4
    recovery_leg_length_m: null
    recovery_leg_height_m: null
    recovery_forward_leg_height_m: null
    rise_duration_s: 1.5
    zero_torque_s: 0.2
    recovery_timeout_s: 5.0
    disturbance_phase: 2
    # 落地及之后的阶段把平滑惩罚降到平地权重的 1/5，给落地缓冲留出动作空间（SCUT Flat-v1 的做法，
    # V14/env_cfg.py:1662-1668）。没有照抄 SCUT 的数值：它在 50 Hz 下把两个动作二阶差分降到 1/10，
    # 我们 100 Hz 下同样平滑的动作二阶差分本来就只有 1/16，统一按本项目平地权重 ×0.2 取值。
    reward_overrides: {action_rate: -0.002, action_smoothness_leg: -0.01, action_smoothness_wheel: -0.002,
      leg_joint_vel: -0.001, wheel_vel: -2.0e-06}
    terrain:
      tile_size_m: *id003
      rows: 8
      columns: 10
      flat_proportion: 0.3
      step_height_range_m: null
      step_width_m: null
      slope_proportion: 0.1
      bump_proportion: 0.1
      slope_angle_range_rad:
      - 0.0
      - 0.4363323129985824
      bump_height_range_m: null
      bump_spacing_m: null
      bump_width_m: null
      # 改自 SCUT manager/mdp/isaaclab/terrains.py:109-115 (RANDOM_UNIFORM_FOR_RM)：随机起伏地面，噪声 0-3 cm。
      # SCUT 定义了波浪地形但各地形集都没有启用，这里也不加。
      rough_proportion: 0.1
      rough_noise_range_m: [0.0, 0.03]
      rough_noise_step_m: 0.005
      rough_downsampled_scale_m: 0.2
      heightfield_border_width_m: 1.0
      # Flat ring around the whole tile grid (IsaacLab border, top at ground level); nothing exists beyond it.
      border_width_m: 5.0
      # Leaving the grid shrunk by this margin ends the episode as a timeout (SCUT V14 default 0.5 m).
      boundary_margin_m: 0.5
    stair_detection_distance_m: 0.5
    stair_detection_height_m: 0.05
    stair_false_positive: 0.1
    stair_false_negative: 0.1
    progress_weight: 1.0
    stuck_weight: -1.0
    impact_weight: -0.001
    stuck_window_s: 1.0
    stuck_distance_m: 0.05
    step_height_boost_m: 0.16
    step_height_hold_s: 2.0
    step_height_trigger_distance_m: 0.14
mode_semantics:
- normal
- stair
- zero
- recover
- zero
- zero
- zero
guide_version: '2.2'
