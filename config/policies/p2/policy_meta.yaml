# Runtime-only SHU template. null means pending; explicit zero disables a reward term.
name: p2_spin
obs_version: 4
hidden_dims:
- 128
- 64
- 32
activation: elu
observation_scales:
  command:
  - 1.0
  - 1.0
  - 1.0
  height: 5.0
  angular_velocity: 0.5
  gravity: 1.0
  joint_position: 1.0
  joint_velocity: 0.1
action_scales:
- 0.5
- 0.5
- 10.0
- 0.5
- 0.5
- 10.0
action_clip: null
kp:
- null
- null
- null
- null
- null
- null
kd:
- null
- null
- null
- null
- null
- null
torque_limit_nm:
- null
- null
- null
- null
- null
- null
policy_family: p2
training:
  seed: 42
  num_envs: 4096
  rollout_steps: 48
  max_iterations: 20000
  save_interval: 500
  episode_length_s: 40.0
  init_noise_std: 1.0
  reward_clip: 1.0  # per second; contacts have their own -2/s floor
  ppo:
    value_loss_coef: 2.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.995
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  commands:
    segment_duration_s: [3.0, 15.0]
    height_duration_s: [2.0, 6.0]
    height_range_m: null
    linear_slew_m_s2: 2.0
    angular_slew_rad_s2: 10.0
  reward_parameters:
    vx_tol_max: 0.50
    vx_tol_knee: 0.625
    wz_tol_max: 0.50
    wz_tol_knee: 0.625
    vx_error_sigma: 2.5
    wz_error_sigma: 2.5
    height_gate_shape: 2.0
    height_sigma: 0.001
    fork_deadzone_m: 0.05  # threshold term only, never deducted from squared offset
    contact_force_n: null
    spin_velocity_sigma: null
    spin_heading_sigma: null
    fork_square_scale: 5.0
  rewards:
    track_ang_vel: 1.0
    ang_vel_error: -1.0
    track_height: 1.0
    orientation: -1.0
    vertical_velocity: -1.0
    angular_xy: -0.2
    no_fork: -1.0
    no_fork_square: -1.0
    undesired_contact: -2.0
    stand_still: -1.0
    termination: -4.0
    spin_velocity: null
    spin_speed: null
    spin_heading: null
    spin_velocity_error: null
    spin_speed_error: null
    leg_symmetry: 0.0
  evaluation:
    observation_delay_steps: null
    action_delay_steps: null
    duration_s: 30.0
    settling_s: 1.0
    episodes_per_case: 16
    seed: 123
    height_m: null
    vx_values_m_s: null
    wz_values_rad_s: null
    combined_commands: null
stages:
  spin:
    spin_rates_rad_s: null
    spin_probabilities: null
    hardware_spin_limit_rad_s: null
    center_drift_tolerance_m: null
guide_version: '2.1'
